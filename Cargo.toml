[package]
name = "pith-cdc"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "FastCDC content-defined chunking with a 16-level gear mask table (zero-dep Rust)"
readme = "README.md"
license = "MIT"
categories = ["algorithms", "cryptography"]

[dependencies]
pith-digest = { git = "https://github.com/pith-hash/pith-digest.git", branch = "main" }

[[bin]]
name = "gen-reference"
path = "tools/gen-reference/main.rs"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

